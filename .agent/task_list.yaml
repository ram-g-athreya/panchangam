  - id: update-panchangam-calculation
    priority: 1
    title: Update panchangam calculation based on `src/core/ARCHITECTURE.md`
    status: passing
    verification:
      - npm run check (tsc --noEmit) exits 0
    evidence:
      - panchangam.ts: lahiriAyanamsha — 23.85944 + 1.396333*T + 0.0003088*T² (high-precision Chitrapaksha coefficients) (2026-05-06)
      - panchangam.ts: tropicalSunLongitude — L0 280.46646 + 36000.76983*T; M 357.5291092 + 35999.0502909*T; C (1.914602 - 0.004817*T)*sin(M) + 0.019993*sin(2M) + 0.000101*sin(3M) — matches updated spec (2026-05-07)
      - panchangam.ts: tropicalMoonLongitude — all 5 fundamental arguments updated to precise spec coefficients; correction reduced to exactly 9 spec terms (removed 4 extra terms) (2026-05-06)
      - panchangam.ts: computeSunriseDateForDay — zenith 90.8333 (90°50'), returns Date object (2026-05-06)
      - panchangam.ts: computeGoverningsunrise — if date is before today's sunrise, previous day's sunrise governs (Temporal Anchoring rule) (2026-05-06)
      - panchangam.ts: vara derived from sunriseDate.getUTCDay() (not input date) (2026-05-06)
      - panchangam.ts: namasamvatsare uses sunriseDate and Shaka-based formula: (Shaka_Year + 12) % 60, Shaka = Gregorian - 78 (adj -1 before Chaitra) (2026-05-06)
      - panchangam.ts: Nakshatra/Yoga width uses 360/27 constant (not 13.3333) to eliminate cumulative rounding (2026-05-06)
      - npm run check passed with no errors (2026-05-07)
